<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vikash Calculator</title>
    <link rel = "stylesheet" href = "calculator.css">
</head>
<body>
    <div id = "calculator">
        <input type ="text" id = "display" readonly>
    <div id = "btn-container">
        <button class = "btn" onclick="currentDisplay = ''; document.getElementById('display').value = currentDisplay;">C</button>

        <button class = "btn" onclick="currentDisplay = currentDisplay+'1'; document.getElementById('display').value = currentDisplay;">1</button>

        <button class = "btn" onclick="currentDisplay = currentDisplay+'2'; document.getElementById('display').value = currentDisplay;">2</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'+'; document.getElementById('display').value = currentDisplay;">+</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'3'; document.getElementById('display').value = currentDisplay;">3</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'4'; document.getElementById('display').value = currentDisplay;">4</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'-'; document.getElementById('display').value = currentDisplay;">-</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'5'; document.getElementById('display').value = currentDisplay;">5</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'6'; document.getElementById('display').value = currentDisplay;">6</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'*'; document.getElementById('display').value = currentDisplay;">*</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'7'; document.getElementById('display').value = currentDisplay;">7</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'8'; document.getElementById('display').value = currentDisplay;">8</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'/'; document.getElementById('display').value = currentDisplay;">/</button>
        <button class = "btn" onclick="
        let result = eval(currentDisplay);
        document.getElementById('display').value = result;">=</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'9'; document.getElementById('display').value = currentDisplay;">9</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'0'; document.getElementById('display').value = currentDisplay;">0</button>
        <button class = "btn" onclick="currentDisplay = currentDisplay+'.'; document.getElementById('display').value = currentDisplay;">.</button>
    </div>
    </div>
        
    
    <script>
        let currentDisplay = '';
        document.getElementById('display').value = currentDisplay;
    </script>
</body>
</html>
